aid: fundguard
name: FundGuard
description: >-
  FundGuard is an AI-powered, cloud-native investment accounting operating system for asset managers, asset owners,
  custodian banks and fund administrators. A single real-time accounting engine acts as the core system of record
  across Fund Accounting/ABOR, Investment Accounting/IBOR and Private Markets portfolio accounting, supporting mutual
  funds, ETFs, hedge funds, insurance products and pension funds with multi-book views (ABOR, IBOR, GAAP, tax,
  performance, currency and custom), shadow and contingent NAV, reconciliation, Report Studio and AI-driven anomaly
  detection with suggested resolutions. Founded 2018, headquartered in New York with offices in Dedham MA, Tel Aviv
  and London; backed by Citi, State Street, Key1 Capital, Blumberg Capital, Euclidean Capital, Hamilton Lane, LionBird
  and Team8, and running on AWS and Microsoft Azure. The platform is marketed as API-first for front- and middle-office
  integration with portfolio management systems, custodians, administrators and data providers, but as of this pass
  FundGuard publishes no public developer portal, API reference or machine-readable API contract — the customer
  knowledge base at kb.fundguard.com is behind a login and the product runs on per-tenant hosts.
