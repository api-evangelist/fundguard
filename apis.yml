apis:
- name: FundGuard Website MCP Server
  description: >-
    A Model Context Protocol server served from FundGuard's own corporate web host via the WordPress MCP adapter,
    advertised through RFC 8414 OAuth authorization-server metadata and RFC 9728 protected-resource metadata at
    www.fundguard.com. Authorization is OAuth 2.1 authorization_code with PKCE (S256), public clients via client-id
    metadata documents, and a single `mcp` scope. tools/list returned HTTP 401 anonymously on 2026-08-01, so the tool
    set and input schemas require an authenticated introspection. This is the corporate/marketing site surface — it is
    NOT the FundGuard investment accounting platform API, which is not publicly documented.
  humanURL: https://www.fundguard.com/
  baseURL: https://www.fundguard.com/wp-json/mcp/mcp-oauth-server
  tags:
  - MCP
  - agent-native
  - Authentication
  tags_raw:
  - mcp
  - agent-native
  - oauth2
  properties:
